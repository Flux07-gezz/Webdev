<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Transforms</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
        }
        body{
            width:100%;
            height: 100%;
        }
        .container{
            padding:5rem;
            background-color: blanchedalmond;
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap:1rem;
        }
        .item{
            padding:2rem;
            height: 150px;
            width: 150px;
            background-color: cadetblue;
            border: 2px solid black;
        }
        #rotx:hover{
            transform: rotateX(45deg);
        }
        #roty:hover{
            transform: RotateY(45deg);
        }
        #rotz:hover{
            transform: RotateZ(45deg);
        }
        #tranx:hover{
            transform: TranslateX(100px);
        }
        #trany:hover{
            transform: TRanslateY(100px);
        }
        #tranz:hover{
            transform: perspective(300px) TranslateZ(100px);
        }
        #scalex:hover{
            transform: ScaleX(1.5);
        }
        #scaley:hover{
            transform: scaleY(1.5);
        }
        #scalez:hover{
            transform: perspective(300px) SCaleZ(5) rotatey(30deg);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="rotx">RotateX</div>
        <div class="item" id="roty">RotateY</div>
        <div class="item" id="rotz">RotateZ</div>
        <div class="item" id="tranx">TranslateX</div>
        <div class="item" id="trany">TRanslateY</div>
        <div class="item" id="tranz">TranslateZ</div>
        <div class="item" id="scalex">ScaleX</div>
        <div class="item" id="scaley">ScaleY</div>
        <div class="item" id="scalez">SCaleZ</div>
    </div>
</body>
</html>
