<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid template areas</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            width: 100%;
            height: 100%;
        }
        .container{
            width: 100%;
            height: 100%;
            display:grid;
            gap:1rem;
            background-color: rgba(56, 9, 9, 0.607);
            padding:4rem;
            grid-template-areas: 
                "header header header"
                "sidebar content1 content1"
                "sidebar content2 content3"
                "footer footer footer"
            ;
        }
        .item{
            background-color: darkcyan;
            border: 2px black solid ;
            padding: 1rem;
            color: rgb(254, 254, 253);
        }
        #h{
            grid-area: header;
        }
        #sb{
            grid-area: sidebar;
        }
        #c1{
            grid-area: content1;
        }
        #c2{
            grid-area: content2;
        }
        #c3{
            grid-area: content3;
        }
        #f{
            grid-area: footer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="h">header</div>
        <div class="item" id="sb">sidebar</div>
        <div class="item" id="c1">content1</div>
        <div class="item" id="c2">content2</div>
        <div class="item" id="c3">content3</div>
        <div class="item" id="f">footer</div>
    </div>
</body>
</html>
