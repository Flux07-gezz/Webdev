    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .red{
            background-color:rgb(113, 27, 27);
            color:rgb(228, 44, 44);
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="box1" class="box">Box1</div>
        <div id="box2" class="box">Box2</div>
        <div id="box3" class="box">Box3</div>
        <button onclick="magic()" id="button1" class="button">Do the Magic</button>
    </div>
    <script>
        function magic(){
            let divs = document.getElementsByTagName("div"); // for box1
            //console.log(divs);
            for (ele of divs){
                //ele.innerHTML=ele.innerHTML+"<p>I am Good</p>";
                ele.classList.add("red"); // to add a class to the element
                ele.classList.remove("box"); // to remove a class from the element if it exists
            }
        
        }

        
    </script>
</body>
</html>
